# =====================================================================
# Nginx para n8n - Constructora MYRA
# Reemplaza myra.ucn.cl por tu dominio real.
#
# Este archivo es solo HTTP. Certbot agrega el bloque HTTPS y la
# redireccion automaticamente:
#
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/myra.conf /etc/nginx/sites-available/myra
#   sudo ln -s /etc/nginx/sites-available/myra /etc/nginx/sites-enabled/myra
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d myra.ucn.cl
#
# Si prefieres certificados manuales, agrega un server listen 443 ssl
# con ssl_certificate/ssl_certificate_key y los mismos headers.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name myra.ucn.cl;

    # Audios/fotos de Telegram y exports.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;

        # n8n usa WebSockets para la UI y para ejecuciones en vivo.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las llamadas a Gemini/Telegram pueden tardar.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
