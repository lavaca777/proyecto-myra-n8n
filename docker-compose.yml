# =====================================================================
# Constructora MYRA - stack local
#   docker compose up -d
#
# Servicios:
#   postgres  -> base de datos de la aplicacion (myra)
#   n8n       -> orquestador; guarda sus workflows en ./n8n/data (SQLite)
#
# La base de datos de n8n sigue siendo SQLite a proposito: asi los
# workflows y credenciales actuales se conservan tal cual. PostgreSQL
# se usa solo para los datos del negocio (gastos, proyectos, etc.).
# =====================================================================

name: myra

services:
  postgres:
    image: postgres:16
    container_name: myra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/Santiago
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Solo se ejecuta cuando el volumen esta vacio (primera vez).
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # En el servidor se puede dejar solo en localhost (PG_BIND=127.0.0.1).
      - "${PG_BIND:-127.0.0.1}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    # Version probada en desarrollo. Actualizar deliberadamente, no con :latest.
    image: docker.n8n.io/n8nio/n8n:2.42.6
    container_name: myra-n8n
    restart: unless-stopped
    ports:
      # En el servidor con proxy en el mismo host: N8N_BIND=127.0.0.1
      - "${N8N_BIND:-0.0.0.0}:5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Santiago
      TZ: America/Santiago
      # Debe ser la MISMA clave con la que se cifraron las credenciales.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # URL publica que Telegram usa para llamar al bot.
      # En local: http://localhost:5678/  |  tunel: lo actualiza scripts/tunnel.ps1
      # n8n 2.x recomienda N8N_WEBHOOK_URL; en el .env lo seguimos llamando WEBHOOK_URL.
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL}
      # Detras de Nginx/Caddy en el mismo host. Con Cloudflare + proxy, usar 2.
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - ./n8n/data:/home/node/.n8n     # workflows, credenciales y SQLite
      - ./n8n/workflows:/workflows     # export de workflows para git
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
    # Nombre fijo: no cambia si mueves la carpeta del proyecto.
    # Se reutiliza el volumen del compose anterior (Myra_db) si existe.
    # Es external para que Compose no lo recree al cambiar el nombre del proyecto;
    # scripts/start.ps1 lo crea si no existe.
    name: myra_db_pg_data
    external: true
